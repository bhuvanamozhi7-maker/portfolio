<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message Sent</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 50px 35px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #222;
        }

        p {
            font-size: 16px;
            line-height: 1.7;
            color: #666;
            margin-bottom: 30px;
        }

        .home-btn {
            display: inline-block;
            padding: 13px 25px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
        }

        .home-btn:hover {
            transform: translateY(-3px);
            background: #5568d9;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #999;
        }

        @media (max-width: 500px) {
            .card {
                padding: 40px 25px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">
            ✉️
        </div>

        <h1>Message Sent Successfully! 🎉</h1>

        <p>
            Thank you for contacting me!
            Your message has been received successfully.
            I will get back to you as soon as possible.
        </p>

        <a href="index.html" class="home-btn">
            ← Back to Home
        </a>

        <div class="footer">
            Thank you for visiting my portfolio ❤️
        </div>

    </div>

</body>
</html>
